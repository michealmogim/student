
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Page</title>

    
</head>

<body>
    <main class="container">
        <h1>Student Registration</h1>
        <p>Please fill in your details below.</p>

        <form action="#" method="post">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required><br>

            <label for="matric">Matriculation Number:</label>
            <input type="text" id="matric" name="matric"
                   placeholder="Enter your matric number" required><br>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">-- Select Department --</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Cyber Security">Cyber Security</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Statistics">Statistics</option>
            </select><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="example@email.com" required><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="Enter your phone number" required><br>

            <label>Gender:</label>
            <div class="gender-option">
                <input type="radio" id="male" name="gender"
                       value="Male" required>
                <label for="male">Male</label>
            </div><br>

            <div class="gender-option">
                <input type="radio" id="female" name="gender"
                       value="Female">
                <label for="female">Female</label>
            </div><br>

            <div class="gender-option">
                <input type="radio" id="other" name="gender"
                       value="Other">
                <label for="other">Other</label>
            </div><br>

            <label for="programme">Programme:</label>
            <select id="programme" name="programme" required>
                <option value="">-- Select Programme --</option>
                <option value="ND">National Diploma (ND)</option>
                <option value="HND">Higher National Diploma (HND)</option>
                <option value="BSc">Bachelor's Degree</option>
                <option value="MSc">Master's Degree</option>
                <option value="PhD">Doctor of Philosophy (PhD)</option>
            </select><br>

            <button type="submit">Submit Registration</button>

        </form>
    </main>
</body>
</html>
